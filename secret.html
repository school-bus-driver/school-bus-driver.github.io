<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secret Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f6fa;
    min-height: 100vh;
}
.card {
    background: white;
    padding: 24px;
    max-width: 640px;
    margin: 20px auto;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
h2 { text-align: center; margin-bottom: 20px; color: #222; }
h3 { margin-bottom: 12px; color: #444; font-size: 16px; }

.add-row { display: flex; gap: 8px; margin-bottom: 20px; }
.add-row input {
    flex: 1; padding: 10px 12px;
    border-radius: 6px; border: 1px solid #ddd; font-size: 14px;
}
.add-row input:focus { outline: none; border-color: #2d89ff; }

button {
    padding: 10px 18px; border-radius: 6px; border: none;
    background: #2d89ff; color: white; cursor: pointer;
    font-size: 14px; white-space: nowrap;
}
button:hover { background: #1b69d6; }
button:disabled { background: #aaa; cursor: default; }
button.danger { background: #e74c3c; }
button.danger:hover { background: #c0392b; }
button.secondary { background: #eee; color: #333; }
button.secondary:hover { background: #ddd; }

.link-item {
    padding: 12px 10px; border-bottom: 1px solid #f0f0f0;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.link-item:last-child { border-bottom: none; }
.link-item a {
    color: #2d89ff; text-decoration: none; font-size: 14px;
    word-break: break-all; flex: 1;
}
.link-item a:hover { text-decoration: underline; }
.empty { color: #999; text-align: center; padding: 20px; font-size: 14px; }

hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }

#status {
    font-size: 13px; text-align: center;
    margin-top: 10px; min-height: 20px;
}
.ok  { color: #27ae60; }
.err { color: #e74c3c; }

.row { display: flex; gap: 8px; }
.row input {
    flex: 1; padding: 10px 12px;
    border-radius: 6px; border: 1px solid #ddd; font-size: 14px;
}
.row input:focus { outline: none; border-color: #2d89ff; }
</style>
</head>
<body>
<div class="card">
    <h2>🔗 Hidden URL List</h2>

    <div class="add-row">
        <input id="newUrl" placeholder="example.com or https://example.com"
               onkeydown="if(event.key==='Enter') addUrl()">
        <button onclick="addUrl()" id="addBtn">Add</button>
    </div>

    <div id="links"><div class="empty">Loading...</div></div>
    <div id="status"></div>

    <hr>
    <h3>Change Password</h3>
    <div class="row">
        <input type="password" id="newPass" placeholder="New password"
               onkeydown="if(event.key==='Enter') changePassword()">
        <button onclick="changePassword()">Save</button>
    </div>
</div>

<script>
const WORKER = "https://app.4388450.workers.dev";
const PASS_KEY = "adminPassword";

let adminPass = sessionStorage.getItem("adminPass")
             || localStorage.getItem(PASS_KEY)
             || "1234";

// ─── INIT ────────────────────────────────────────────────────────────────────
window.onload = () => loadUrls();

// ─── STATUS ──────────────────────────────────────────────────────────────────
function setStatus(msg, cls) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = cls || "";
    if (cls) setTimeout(() => { el.textContent = ""; el.className = ""; }, 3000);
}

// ─── LOAD ────────────────────────────────────────────────────────────────────
async function loadUrls() {
    setStatus("Loading...");
    try {
        const res = await fetch(WORKER + "/links");
        const data = await res.json();
        renderUrls(data.links || []);
        setStatus("☁️ Loaded from Cloudflare", "ok");
    } catch(e) {
        setStatus("Error loading links: " + e.message, "err");
        document.getElementById("links").innerHTML = '<div class="empty">Could not reach Worker.</div>';
    }
}

function renderUrls(list) {
    const container = document.getElementById("links");
    if (!list.length) {
        container.innerHTML = '<div class="empty">No URLs yet. Add one above!</div>';
        return;
    }
    container.innerHTML = "";
    list.forEach((url, i) => {
        const div = document.createElement("div");
        div.className = "link-item";
        div.innerHTML = `<a href="${esc(url)}" target="_blank">${esc(url)}</a>
                         <button class="danger" onclick="deleteUrl(${i})">Delete</button>`;
        container.appendChild(div);
    });
}

function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── ADD ─────────────────────────────────────────────────────────────────────
async function addUrl() {
    let url = document.getElementById("newUrl").value.trim();
    if (!url) return;
    if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://" + url;

    document.getElementById("addBtn").disabled = true;
    setStatus("Saving...");
    try {
        const res = await fetch(WORKER + "/links", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Admin-Password": adminPass },
            body: JSON.stringify({ url })
        });
        if (res.status === 401) { setStatus("Wrong password — try logging out and back in", "err"); return; }
        const data = await res.json();
        renderUrls(data.links || []);
        document.getElementById("newUrl").value = "";
        setStatus("✅ Saved", "ok");
    } catch(e) {
        setStatus("Error: " + e.message, "err");
    }
    document.getElementById("addBtn").disabled = false;
}

// ─── DELETE ──────────────────────────────────────────────────────────────────
async function deleteUrl(i) {
    setStatus("Deleting...");
    try {
        const res = await fetch(WORKER + "/links/" + i, {
            method: "DELETE",
            headers: { "X-Admin-Password": adminPass }
        });
        if (res.status === 401) { setStatus("Wrong password", "err"); return; }
        const data = await res.json();
        renderUrls(data.links || []);
        setStatus("✅ Deleted", "ok");
    } catch(e) {
        setStatus("Error: " + e.message, "err");
    }
}

// ─── CHANGE PASSWORD ─────────────────────────────────────────────────────────
async function changePassword() {
    const newP = document.getElementById("newPass").value.trim();
    if (!newP) { alert("Enter a password"); return; }
    setStatus("Saving password...");
    try {
        const res = await fetch(WORKER + "/password", {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Admin-Password": adminPass },
            body: JSON.stringify({ newPassword: newP })
        });
        if (res.status === 401) { setStatus("Current password is wrong", "err"); return; }
        adminPass = newP;
        localStorage.setItem(PASS_KEY, newP);
        sessionStorage.setItem("adminPass", newP);
        setStatus("✅ Password changed", "ok");
        document.getElementById("newPass").value = "";
    } catch(e) {
        setStatus("Error: " + e.message, "err");
    }
}
</script>
</body>
</html>
