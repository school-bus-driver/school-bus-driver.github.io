<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secret Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f6fa;
    min-height: 100vh;
}
.card {
    background: white;
    padding: 24px;
    max-width: 640px;
    margin: 20px auto;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
h2 { text-align: center; margin-bottom: 20px; color: #222; }
h3 { margin-bottom: 12px; color: #444; font-size: 16px; }

.add-row { display: flex; gap: 8px; margin-bottom: 20px; }
.add-row input {
    flex: 1; padding: 10px 12px;
    border-radius: 6px; border: 1px solid #ddd; font-size: 14px;
}
.add-row input:focus { outline: none; border-color: #2d89ff; }

button {
    padding: 10px 18px; border-radius: 6px; border: none;
    background: #2d89ff; color: white; cursor: pointer;
    font-size: 14px; white-space: nowrap;
}
button:hover { background: #1b69d6; }
button:disabled { background: #aaa; cursor: default; }
button.danger { background: #e74c3c; }
button.danger:hover { background: #c0392b; }
button.secondary { background: #eee; color: #333; }
button.secondary:hover { background: #ddd; }

.link-item {
    padding: 12px 10px; border-bottom: 1px solid #f0f0f0;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.link-item:last-child { border-bottom: none; }
.link-item a {
    color: #2d89ff; text-decoration: none; font-size: 14px;
    word-break: break-all; flex: 1;
}
.link-item a:hover { text-decoration: underline; }
.empty { color: #999; text-align: center; padding: 20px; font-size: 14px; }

hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }

#status {
    font-size: 13px; text-align: center;
    margin-top: 10px; min-height: 20px;
}
.ok  { color: #27ae60; }
.err { color: #e74c3c; }

.row { display: flex; gap: 8px; }
.row input {
    flex: 1; padding: 10px 12px;
    border-radius: 6px; border: 1px solid #ddd; font-size: 14px;
}
.row input:focus { outline: none; border-color: #2d89ff; }

/* Setup banner */
#setupBanner {
    background: #fff8e1; border: 1px solid #ffd54f;
    border-radius: 8px; padding: 14px 16px; margin-bottom: 20px;
    font-size: 13px; color: #555; display: none;
}
#setupBanner strong { color: #222; }
#setupBanner input {
    width: 100%; margin: 8px 0; padding: 8px 10px;
    border-radius: 6px; border: 1px solid #ddd; font-size: 13px;
}
#setupBanner input:focus { outline: none; border-color: #2d89ff; }
</style>
</head>
<body>
<div class="card">
    <h2>🔗 Hidden URL List</h2>

    <!-- Worker URL setup banner (shown if not configured) -->
    <div id="setupBanner">
        <strong>⚙️ One-time setup:</strong> Enter your Cloudflare Worker URL to enable permanent storage.<br>
        (e.g. <code>https://your-worker.your-subdomain.workers.dev</code>)
        <input type="text" id="workerUrlInput" placeholder="https://your-worker.workers.dev">
        <input type="password" id="setupPassInput" placeholder="Admin password (default: 1234)">
        <button onclick="saveWorkerUrl()" style="margin-top:4px;">Save & Connect</button>
        <div id="setupErr" style="color:#e74c3c; font-size:12px; margin-top:6px;"></div>
    </div>

    <div class="add-row">
        <input id="newUrl" placeholder="example.com or https://example.com"
               onkeydown="if(event.key==='Enter') addUrl()">
        <button onclick="addUrl()" id="addBtn">Add</button>
    </div>

    <div id="links"><div class="empty">Loading...</div></div>
    <div id="status"></div>

    <hr>
    <h3>Change Password</h3>
    <div class="row">
        <input type="password" id="newPass" placeholder="New password"
               onkeydown="if(event.key==='Enter') changePassword()">
        <button onclick="changePassword()">Save</button>
    </div>

    <hr>
    <h3>Worker Settings</h3>
    <p style="font-size:13px; color:#888; margin-bottom:10px;">
        Connected to: <span id="workerStatus" style="color:#e74c3c;">Not configured</span>
    </p>
    <button class="secondary" style="font-size:13px; padding:8px 14px;"
            onclick="reconfigure()">⚙️ Change Worker URL</button>
</div>

<script>
// ─── KEYS ────────────────────────────────────────────────────────────────────
const WORKER_KEY = "cf_worker_url";
const PASS_KEY   = "adminPassword";

let workerUrl = localStorage.getItem(WORKER_KEY) || "";
let adminPass = sessionStorage.getItem("adminPass") || localStorage.getItem(PASS_KEY) || "1234";

// ─── INIT ────────────────────────────────────────────────────────────────────
window.onload = () => {
    if (!workerUrl) {
        document.getElementById("setupBanner").style.display = "block";
        document.getElementById("links").innerHTML = '<div class="empty">Configure Worker URL above to load links.</div>';
    } else {
        updateWorkerStatus();
        loadUrls();
    }
};

function updateWorkerStatus() {
    const el = document.getElementById("workerStatus");
    if (workerUrl) {
        el.textContent = "✅ " + workerUrl;
        el.style.color = "#27ae60";
    } else {
        el.textContent = "❌ Not configured";
        el.style.color = "#e74c3c";
    }
}

// ─── SETUP ───────────────────────────────────────────────────────────────────
async function saveWorkerUrl() {
    let url = document.getElementById("workerUrlInput").value.trim().replace(/\/$/, "");
    const pass = document.getElementById("setupPassInput").value || "1234";
    const errEl = document.getElementById("setupErr");
    errEl.textContent = "";

    if (!url) { errEl.textContent = "Please enter your Worker URL."; return; }
    if (!url.startsWith("http")) url = "https://" + url;

    errEl.textContent = "Testing connection...";
    try {
        const res = await fetch(url + "/links");
        if (!res.ok) throw new Error("Worker returned error " + res.status);
        workerUrl = url;
        adminPass = pass;
        localStorage.setItem(WORKER_KEY, workerUrl);
        localStorage.setItem(PASS_KEY, adminPass);
        sessionStorage.setItem("adminPass", adminPass);
        document.getElementById("setupBanner").style.display = "none";
        updateWorkerStatus();
        loadUrls();
    } catch(e) {
        errEl.textContent = "❌ Could not reach Worker: " + e.message;
    }
}

function reconfigure() {
    document.getElementById("workerUrlInput").value = workerUrl;
    document.getElementById("setupErr").textContent = "";
    document.getElementById("setupBanner").style.display = "block";
}

// ─── STATUS ──────────────────────────────────────────────────────────────────
function setStatus(msg, cls) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = cls || "";
    if (cls) setTimeout(() => { el.textContent = ""; el.className = ""; }, 3000);
}

// ─── LOAD ────────────────────────────────────────────────────────────────────
async function loadUrls() {
    setStatus("Loading...");
    try {
        const res = await fetch(workerUrl + "/links");
        const data = await res.json();
        renderUrls(data.links || []);
        setStatus("☁️ Loaded from Cloudflare", "ok");
    } catch(e) {
        setStatus("Error loading links: " + e.message, "err");
        document.getElementById("links").innerHTML = '<div class="empty">Could not reach Worker.</div>';
    }
}

function renderUrls(list) {
    const container = document.getElementById("links");
    if (!list.length) {
        container.innerHTML = '<div class="empty">No URLs yet. Add one above!</div>';
        return;
    }
    container.innerHTML = "";
    list.forEach((url, i) => {
        const div = document.createElement("div");
        div.className = "link-item";
        div.innerHTML = `<a href="${esc(url)}" target="_blank">${esc(url)}</a>
                         <button class="danger" onclick="deleteUrl(${i})">Delete</button>`;
        container.appendChild(div);
    });
}

function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── ADD ─────────────────────────────────────────────────────────────────────
async function addUrl() {
    let url = document.getElementById("newUrl").value.trim();
    if (!url) return;
    if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://" + url;

    document.getElementById("addBtn").disabled = true;
    setStatus("Saving...");
    try {
        const res = await fetch(workerUrl + "/links", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Admin-Password": adminPass },
            body: JSON.stringify({ url })
        });
        if (res.status === 401) { setStatus("Wrong password — re-enter below", "err"); return; }
        const data = await res.json();
        renderUrls(data.links || []);
        document.getElementById("newUrl").value = "";
        setStatus("✅ Saved", "ok");
    } catch(e) {
        setStatus("Error: " + e.message, "err");
    }
    document.getElementById("addBtn").disabled = false;
}

// ─── DELETE ──────────────────────────────────────────────────────────────────
async function deleteUrl(i) {
    setStatus("Deleting...");
    try {
        const res = await fetch(workerUrl + "/links/" + i, {
            method: "DELETE",
            headers: { "X-Admin-Password": adminPass }
        });
        if (res.status === 401) { setStatus("Wrong password", "err"); return; }
        const data = await res.json();
        renderUrls(data.links || []);
        setStatus("✅ Deleted", "ok");
    } catch(e) {
        setStatus("Error: " + e.message, "err");
    }
}

// ─── CHANGE PASSWORD ─────────────────────────────────────────────────────────
async function changePassword() {
    const newP = document.getElementById("newPass").value.trim();
    if (!newP) { alert("Enter a password"); return; }
    setStatus("Saving password...");
    try {
        const res = await fetch(workerUrl + "/password", {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Admin-Password": adminPass },
            body: JSON.stringify({ newPassword: newP })
        });
        if (res.status === 401) { setStatus("Current password is wrong", "err"); return; }
        adminPass = newP;
        localStorage.setItem(PASS_KEY, newP);
        sessionStorage.setItem("adminPass", newP);
        setStatus("✅ Password changed", "ok");
        document.getElementById("newPass").value = "";
    } catch(e) {
        setStatus("Error: " + e.message, "err");
    }
}
</script>
</body>
</html>
